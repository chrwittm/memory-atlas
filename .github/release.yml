# GitHub auto-generated release notes configuration.
# See docs/operations/macos-packaging.md for the full Memory Atlas release runbook.

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: User-facing changes
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Packaging and distribution
      labels:
        - packaging
        - release
        - deployment
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - "*"
